[project]
name = "ascii2skin"
version = "0.2.0"
description = "Offline encoder/decoder for CS skin Paint Seeds (the 'skin secret' algorithm)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
ascii2skin = "ascii2skin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ascii2skin"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
